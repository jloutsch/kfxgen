name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  tests:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    # kfxgen runs as a Calibre plugin inside Calibre's bundled Python
    # interpreter — currently 3.14. Testing one Linux × one recent
    # Python version is sufficient for a pure-Python plugin; the
    # previous 3 OSes × 4 Python versions (12 jobs) was wasted CI
    # minutes since the code has no native dependencies and no
    # platform-specific behavior. Windows pip installs alone took
    # 8+ minutes per job.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Integration runs alongside unit: the golden-file corpus is a real
      # regression gate and was never gating anything, because CI only ever
      # ran tests/unit. Suites whose inputs are absent (vendored kfxlib, the
      # public-domain corpus) skip cleanly, so this adds coverage without
      # adding required inputs.
      - name: Run unit + integration tests
        run: |
          pytest tests/unit tests/integration -v

      # Tier 2 decodes our output with jhowell's full kfxlib, which is not in
      # this repository, so every one of its tests skips here and has since the
      # suite was added. A skip is not a failure: the run goes green and reads
      # as "everything checkable was checked", which is how #91 came to cite
      # tier-2 coverage that had not happened. Say it in the job summary
      # instead of leaving it 67 lines deep in a log nobody opens.
      #
      # Deliberately not a failure. Tier 4 fails when unsigned because a human
      # with a Kindle is supposed to act; nobody can act on this one, so a red
      # run would just be a licensing constraint charged to contributors.
      # `tests/unit/test_tier2_record.py` is the part that gates.
      - name: Report that tier 2 did not run
        if: always()
        run: |
          {
            echo "### Tier 2 did not run"
            echo
            echo "Differential decode against upstream \`kfxlib\` is **unverified** in CI."
            echo "The KFX Input zip is not in this repository, so all of"
            echo "\`tests/integration/test_kfxlib_diff.py\` skipped."
            echo
            echo "Last real run, per \`tests/fixtures/vendor/kfx_input_plugin.lastrun.json\`:"
            echo
            echo '```'
            cat tests/fixtures/vendor/kfx_input_plugin.lastrun.json 2>/dev/null || echo "no record"
            echo '```'
            echo
            echo "See #99."
          } >> "$GITHUB_STEP_SUMMARY"

      # tier3_strict is excluded by pytest.ini's addopts, so the line above
      # never runs it and never has. It needs its own invocation with an
      # explicit -m, which overrides that exclusion.
      #
      # It was opt-in because the generator used to emit ~240 byte differences
      # between two runs of the same input, which would have failed every run.
      # #96 fixed that (image style symbols were allocated from an unordered
      # set), so the layer now passes in 0.44s and is worth gating on.
      #
      # A failure here means the bytes moved. That is either a regression or an
      # intentional output change that needs its goldens regenerated — see
      # CONTRIBUTING.md → Updating goldens after an intentional generator
      # change. Do not regenerate to make this green without confirming the
      # drift was intended; that is the whole signal.
      # Scoped to the file rather than bare `-m tier3_strict`. An unscoped run
      # replaces addopts' whole `-m` expression, losing `not device and not
      # slow`, and collects all of `testpaths` (686 items, benchmarks included)
      # to select 9. Naming the file collects 33 and keeps the device filter.
      - name: Byte-identical golden diff (tier-3 strict)
        run: |
          pytest tests/integration/test_golden_corpus.py -m "tier3_strict and not device" -v

  ruff-lint:
    # Enforce ruff for outside contributors who don't have pre-commit
    # installed locally. Scope is whatever ruff.toml configures (currently
    # plugin/, tests/, tools/; research/, scripts/, and kfxlib_minimal/
    # are excluded). This is the canonical full-repo gate — runs both
    # `ruff check` (lint) and `ruff format --check` (style).
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        # The pin lives in requirements-dev.txt and is read from it, so this
        # gate and a contributor's local install cannot drift apart. They did:
        # this step hardcoded 0.15.1 while that file said `ruff>=0.1.0`, which
        # let someone format the tree with a different ruff and fail here for
        # reasons their own tooling never showed them.
        #
        # Installing the whole dev file would cost minutes for one tool, so
        # just the one line is taken from it. The grep failing is better than
        # silently installing the latest: no pin, no lint.
        run: |
          python -m pip install --upgrade pip
          RUFF_PIN="$(grep -E '^ruff==' requirements-dev.txt)"
          if [ -z "$RUFF_PIN" ]; then
            echo "no exact ruff pin in requirements-dev.txt" >&2
            exit 1
          fi
          echo "installing $RUFF_PIN"
          pip install "$RUFF_PIN"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
