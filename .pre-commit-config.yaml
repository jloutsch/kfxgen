# Pre-commit hooks for kfxgen (#56). Local fast-feedback only — CI remains
# the canonical gate for outside contributors who don't have hooks installed.
#
# Setup:
#   pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
#
# Bypass (discouraged; CI will still catch it):
#   SKIP=hook-id git commit
#   git push --no-verify

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-root-test-files
        name: Reject root-level test_*.py files
        description: Test files belong under tests/, not at the repo root (#54).
        # Use printf '%s\n' "$@" rather than `echo "$@" | tr " " "\n"`:
        # the latter splits filenames containing spaces into separate
        # tokens, which silently mis-classifies offenders.
        entry: |
          bash -c '
            offenders=$(printf "%s\n" "$@" | grep -E "^test_[^/]+\.py$" || true)
            if [ -n "$offenders" ]; then
              echo "Root-level test files are not permitted. Move them under tests/:" >&2
              echo "$offenders" >&2
              exit 1
            fi
          ' --
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: no-book-binaries
        name: Reject committed book binaries (.kfx/.epub/.azw3/.mobi)
        description: |
          Belt-and-suspenders against `git add -f` bypassing .gitignore.
          Book binaries belong in research/ (gitignored) or external storage,
          never in the tracked tree.

          One exception: tests/fixtures/golden/expected/*.kfx IS the tier-3
          oracle and is committed on purpose (~6-61 KB each, synthetic, no
          copyrighted source). Without this carve-out the hook blocks the
          regeneration procedure CONTRIBUTING documents, which is how it was
          found — adding a fixture for #113 could not be committed.
        # See no-root-test-files for the printf vs echo|tr rationale.
        entry: |
          bash -c '
            offenders=$(printf "%s\n" "$@" \
              | grep -E "\.(kfx|epub|azw3|mobi)$" \
              | grep -v "^tests/fixtures/golden/expected/[^/]*\.kfx$" || true)
            if [ -n "$offenders" ]; then
              echo "Book binaries cannot be committed. Move to research/ or external storage:" >&2
              echo "$offenders" >&2
              exit 1
            fi
          ' --
        language: system
        pass_filenames: true
        stages: [pre-commit]

      # pytest-tier1 uses language: system, so it runs whatever interpreter it
      # is pointed at rather than one pre-commit manages. Plain `pytest` from
      # PATH is the wrong one on a machine with a system Python ahead of the
      # project venv: it resolves, collects, and then fails on missing dev
      # dependencies (`hypothesis`), which reads as a broken gate rather than
      # a missing environment. So prefer `.venv/bin/pytest` when it exists and
      # fall back to PATH otherwise — a contributor with neither still sees a
      # loud failure, which is the intended behaviour, not a silent skip.
      #
      # Don't switch to language: python without first verifying the hook in a
      # fresh clone — the venv-managed python isn't always the one pre-commit
      # uses.
      - id: pytest-tier1
        name: Run tier-1 unit tests
        description: |
          Pre-push gate per CONTRIBUTING.md oracle hierarchy. Tier-1 tests
          are in-process invariants — fast (<5s today) and never depend on
          a Kindle device. CI runs the broader `not device` set.
        entry: |
          bash -c '
            PYTEST=.venv/bin/pytest
            [ -x "$PYTEST" ] || PYTEST=pytest
            exec "$PYTEST" -m tier1
          ' --
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
